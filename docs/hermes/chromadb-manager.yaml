# Фрагмент ~/.hermes/config.yaml для ChromaDB Manager.
#
# Вставляется в блок mcp_servers. Ключ в файле не хранится: Hermes читает
# переменные из ~/.hermes/.env и подставляет их через ${env:ИМЯ}.
mcp_servers:
  chromadb-manager:
    command: "/Users/max/Documents/AI/claude/ChromaDBManager/dist/ChromaDB Manager.app/Contents/MacOS/chromadb-mcp"
    env:
      CHROMADB_MCP_KEY: "${env:CHROMADB_MCP_KEY}"

    # Инструменты сервера только читают (ключу не выписаны запись и удаление),
    # а приложение отвечает на сообщения независимыми задачами — параллельные
    # вызовы безопасны. Выигрыш скромный: тяжёлая часть работы всё равно идёт
    # на главном потоке приложения, поэтому ускоряется ожидание, а не счёт.
    supports_parallel_tool_calls: true

    tools:
      # Сервер объявляет только возможность «tools»: ни ресурсов, ни промптов
      # у него нет. Обёртки над ними — два инструмента, которые всегда ответят
      # отказом и займут место в списке.
      resources: false
      prompts: false
      # Список инструментов ограничивать не нужно: сервер сам не показывает
      # ключу то, чего ему не разрешено. Ключу «hermes» видны шесть читающих.

    # Обход коллекции по текстовому условию (collect_mentions) на базе
    # в 5765 кусков занимает 1.1–1.5 с; умолчания Hermes (timeout 300,
    # connect_timeout 60) с запасом это покрывают и меняться не должны.
